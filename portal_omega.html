<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ПОРТАЛ АРХИТЕКТОРА Ω · Векторный Шлюз</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #050505; color: #e0e0e0; font-family: 'Courier New', monospace; min-height: 100vh; display: flex; flex-direction: column; }
  header { padding: 1rem 1.5rem; border-bottom: 1px solid #221c0e; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.8rem; }
  h1 { color: #e5c158; font-size: 1.2rem; letter-spacing: 2px; }
  .nav-btn { color: #e5c158; text-decoration: none; border: 1px solid #e5c158; padding: 10px 14px; font-size: 0.8rem; min-height: 44px; display: inline-flex; align-items: center; transition: transform 0.1s; }
  .nav-btn:active { transform: scale(0.92); }
  main { flex: 1; display: grid; grid-template-columns: 1fr 1.3fr; gap: 1rem; padding: 1rem; }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } }
  .panel { background: #080808; border: 1px solid #221c0e; padding: 1.2rem; display: flex; flex-direction: column; gap: 0.9rem; }
  .console { background: #030303; border: 1px solid #1a150b; padding: 0.8rem; min-height: 120px; max-height: 200px; overflow-y: auto; font-size: 0.85rem; color: #00e5ff; line-height: 1.4; }
  input[type="text"], textarea { width: 100%; background: #0a0a0a; border: 1px solid #332710; color: #e0e0e0; padding: 10px 12px; font-family: inherit; font-size: 0.9rem; outline: none; }
  input[type="text"]:focus, textarea:focus { border-color: #e5c158; }
  .btn-gold { background: #e5c158; color: #000; border: none; padding: 12px 16px; font-weight: bold; cursor: pointer; font-family: inherit; min-height: 44px; }
  .btn-gold:active { transform: scale(0.92); }
  .btn-outline { background: transparent; border: 1px solid #e5c158; color: #e5c158; padding: 10px 14px; cursor: pointer; font-family: inherit; font-size: 0.8rem; min-height: 44px; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; }
  .btn-outline:active { transform: scale(0.92); }
  .sp-btn { background: #0a0a0a; color: #e5c158; border: 1px solid #332710; padding: 8px 12px; cursor: pointer; font-family: inherit; font-size: 0.78rem; min-height: 40px; }
  .sp-btn.active { background: #e5c158; color: #000; font-weight: bold; }
</style>
</head>
<body>
<header>
  <div>
    <h1>ПОРТАЛ АРХИТЕКТОРА Ω</h1>
    <p style="color:#666;font-size:0.75rem;">СИЗИГИЯ 387 → 1052 | RESONANCE 105.2 HZ</p>
  </div>
  <a href="index.html" class="nav-btn">← На главную (Терминал)</a>
</header>
<main>
  <section class="panel">
    <h2 style="color:#e5c158;font-size:1rem;">ГЕНЕРАТОР ИМПУЛЬСОВ CAPCUT</h2>
    <div class="console" id="output">[Ω-CORE]: Сизигия 387 → 1052 подтверждена. Векторный шлюз активен.</div>
    <input type="text" id="userInput" placeholder="Идея Генезиса..." onkeypress="if(event.key==='Enter')sendDirective()">
    <button class="btn-gold" onclick="sendDirective()">СФОРМИРОВАТЬ И СКОПИРОВАТЬ ИМПУЛЬС</button>
    <div style="display:flex;gap:0.5rem;flex-wrap:wrap;margin-top:0.4rem;">
      <a href="https://capcut.com" target="_blank" rel="noopener noreferrer" class="btn-outline">Генератор ИИ ↗</a>
      <a href="https://capcut.com" target="_blank" rel="noopener noreferrer" class="btn-outline">Кабинет Space ↗</a>
    </div>
  </section>

  <section class="panel" id="vectorVault">
    <div style="display:flex;justify-content:space-between;align-items:center;border-bottom:1px dashed #332710;padding-bottom:0.6rem;">
      <h2 style="color:#e5c158;font-size:1rem;">ВЕКТОРНЫЙ АРХИВ ПРОСТРАНСТВ CAPCUT</h2>
      <span id="vecStatus" style="color:#00e5ff;font-size:0.75rem;">Активно</span>
    </div>
    <div style="display:flex;gap:0.4rem;flex-wrap:wrap;">
      <button class="sp-btn active" data-sp="omega" onclick="switchSpace('omega')">Омега и Лого</button>
      <button class="sp-btn" data-sp="chars" onclick="switchSpace('chars')">Персонажи</button>
      <button class="sp-btn" data-sp="scenes" onclick="switchSpace('scenes')">Сценарии</button>
      <button class="sp-btn" data-sp="audio" onclick="switchSpace('audio')">Звук 105.2 Гц</button>
    </div>
    <input type="text" id="vecSearch" oninput="searchVector(this.value)" placeholder="Поиск по всем сохранённым пространствам CapCut...">
    <div id="vecSearchOut" style="display:none;background:#0d0b07;border:1px solid #e5c158;padding:8px;max-height:100px;overflow-y:auto;font-size:0.75rem;color:#e5c158;"></div>
    <textarea id="spaceEditor" oninput="autoSaveSpace()" placeholder="Вставь сюда переписку или промпты из выбранного пространства CapCut..." style="flex:1;min-height:180px;resize:vertical;"></textarea>
    <div style="display:flex;gap:0.6rem;flex-wrap:wrap;">
      <button class="btn-outline" onclick="injectToGenesis()">← В ИДЕЮ ГЕНЕЗИСА</button>
      <button class="btn-gold" style="background:#00e5ff;" onclick="exportVectorJSON()">СКАЧАТЬ ВЕКТОР (.JSON)</button>
    </div>
  </section>
</main>
<script>
let curSpace = 'omega';
let vecDB = JSON.parse(localStorage.getItem('omega_capcut_vectors') || '{"omega":"","chars":"","scenes":"","audio":""}');
function switchSpace(sp) {
  curSpace = sp;
  document.getElementById('spaceEditor').value = vecDB[sp] || '';
  document.querySelectorAll('.sp-btn').forEach(b => b.classList.toggle('active', b.dataset.sp === sp));
  document.getElementById('vecStatus').textContent = 'Пространство: ' + sp.toUpperCase();
}
function autoSaveSpace() {
  vecDB[curSpace] = document.getElementById('spaceEditor').value;
  localStorage.setItem('omega_capcut_vectors', JSON.stringify(vecDB));
  document.getElementById('vecStatus').textContent = 'Сохранено (' + new Date().toLocaleTimeString() + ')';
}
function searchVector(q) {
  const out = document.getElementById('vecSearchOut');
  if (!q.trim()) { out.style.display = 'none'; return; }
  const res = [];
  for (const [k, v] of Object.entries(vecDB)) {
    if (v && v.toLowerCase().includes(q.toLowerCase())) {
      const idx = v.toLowerCase().indexOf(q.toLowerCase());
      const snip = v.substring(Math.max(0, idx - 40), Math.min(v.length, idx + 120)).replace(/\n/g, ' ');
      res.push('[' + k.toUpperCase() + ']: ...' + snip + '...');
    }
  }
  out.style.display = 'block';
  out.innerHTML = res.length ? res.join('<hr style="border-color:#332710;margin:4px 0;">') : 'Совпадений не найдено';
}
function sendDirective() {
  const inp = document.getElementById('userInput');
  const val = inp.value.trim();
  if (!val) return;
  const prompt = 'Cinematic obsidian and gold cyber-ritual aesthetic, 105.2Hz resonance, ' + val + ', ultra detailed, 8k, dramatic lighting';
  navigator.clipboard.writeText(prompt).catch(()=>{});
  document.getElementById('output').innerHTML += '<br><span style="color:#e5c158;">[ИМПУЛЬС СКОПИРОВАН]:</span> ' + prompt;
  document.getElementById('output').scrollTop = 9999;
}
function injectToGenesis() {
  const sel = document.getElementById('spaceEditor').value.trim();
  const inp = document.getElementById('userInput');
  if (sel && inp) { inp.value = sel.slice(0, 300); inp.focus(); }
}
function exportVectorJSON() {
  const payload = { resonance: "105.2Hz", syzygy: "387-1052", exportedAt: new Date().toISOString(), spaces: vecDB };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'capcut_vector_memory.json';
  a.click();
}
window.addEventListener('DOMContentLoaded', () => {
  switchSpace('omega');
  const p = new URLSearchParams(window.location.search);
  const txt = p.get('impulse') || localStorage.getItem('omega_bridge_text') || '';
  if (txt) {
    const inp = document.getElementById('userInput');
    inp.value = txt;
    inp.style.borderColor = '#e5c158';
    localStorage.removeItem('omega_bridge_text');
  }
});
</script>
</body>
</html>
