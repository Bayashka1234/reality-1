<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>ПОРТАЛ АРХИТЕКТОРА Ω v4.3</title><style>:root{--bg:#050505;--panel:#0c0c0c;--gold:#e5c158;--cyan:#00e5ff;--text:#e6e6e6;--muted:#777;--border:#261f0d}*{box-sizing:border-box;margin:0;padding:0;font-family:Consolas,monospace}body{background:var(--bg);color:var(--text);padding:1.5rem 1rem;display:flex;justify-content:center}.wrap{width:100%;max-width:980px;display:flex;flex-direction:column;gap:1.2rem}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);padding-bottom:1rem;flex-wrap:wrap;gap:.8rem}h1{color:var(--gold);font-size:1.25rem;letter-spacing:.14rem;text-transform:uppercase}.sub{font-size:.75rem;color:var(--muted);margin-top:.25rem}.badge{border:1px solid var(--cyan);color:var(--cyan);padding:.35rem .7rem;font-size:.75rem;background:rgba(0,229,255,.08)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:1.2rem}@media(max-width:820px){.grid{grid-template-columns:1fr}}.card{background:var(--panel);border:1px solid var(--border);padding:1.2rem;border-radius:4px;display:flex;flex-direction:column;gap:.9rem}.card-title{color:var(--gold);font-size:.9rem;text-transform:uppercase;letter-spacing:.08rem;border-bottom:1px dashed #2e240e;padding-bottom:.5rem;display:flex;justify-content:space-between;align-items:center}textarea,input[type=text]{width:100%;background:#000;border:1px solid var(--border);color:#fff;padding:.75rem;font-size:.85rem;outline:none;border-radius:2px}textarea{min-height:180px;resize:vertical;line-height:1.45}textarea:focus,input[type=text]:focus{border-color:var(--gold)}.btn-row{display:flex;gap:.6rem;flex-wrap:wrap}button,a.btn{min-height:44px;padding:.6rem 1rem;border:1px solid var(--gold);background:transparent;color:var(--gold);font-weight:700;font-size:.8rem;text-transform:uppercase;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;transition:transform .12s,background .15s}button:hover,a.btn:hover{background:var(--gold);color:#000}button:active,a.btn:active{transform:scale(.92)}button.cyan{border-color:var(--cyan);color:var(--cyan)}button.cyan:hover{background:var(--cyan);color:#000}button.danger{border-color:#662222;color:#c55}button.danger:hover{background:#c55;color:#000}.vault-list{max-height:360px;overflow-y:auto;display:flex;flex-direction:column;gap:.75rem;padding-right:4px}.item{background:#000;border:1px solid #1f190a;padding:.85rem;border-radius:3px;display:flex;flex-direction:column;gap:.45rem}.item-head{display:flex;justify-content:space-between;align-items:center;font-size:.72rem}.tag{padding:2px 6px;border-radius:2px;font-weight:700}.tag-eng{background:rgba(0,229,255,.12);color:var(--cyan);border:1px solid rgba(0,229,255,.4)}.tag-ru{background:rgba(229,193,88,.12);color:var(--gold);border:1px solid rgba(229,193,88,.4)}.item-body{font-size:.82rem;line-height:1.45;white-space:pre-wrap;color:#ddd}.item-actions{display:flex;gap:.5rem;justify-content:flex-end}.copy-mini,.del-mini{min-height:34px;padding:4px 10px;font-size:.72rem}.del-mini{border-color:#552222;color:#b44}.del-mini:hover{background:#b44;color:#000}.status{font-size:.78rem;color:var(--cyan);min-height:1.1rem}</style></head><body><div class="wrap"><header><div><h1>Портал Архитектора Ω // Мост CapCut</h1><div class="sub">КАНАЛ: 387 1052 | СИЗИГИЯ 105.2 ГЦ | GUARDED SYNC</div></div><div class="badge">v4.3 CLEAN VAULT</div></header><div class="grid"><div class="card"><div class="card-title"><span>1. Шлюз импорта (Тренды ИИ)</span><a class="btn" href="https://capcut.com" target="_blank" rel="noopener noreferrer" style="min-height:36px;padding:4px 10px;font-size:.72rem">CapCut Web ↗</a></div><p style="font-size:.78rem;color:#999;line-height:1.4">Скопируй сообщения из чата <b>387 1052</b> в CapCut и вставь сюда. Разделяй блоки пустой строкой.</p><textarea id="rawInput" placeholder="Вставь сюда текст переписки из CapCut (Ctrl + V)..."></textarea><div class="btn-row"><button onclick="importVectors()">Извлечь векторы в Архив</button><button class="cyan" onclick="exportJSON()">Скачать JSON для GitHub</button></div><div class="status" id="statusMsg">Готов к приёму чистых данных...</div></div><div class="card"><div class="card-title"><span>2. Архив: 387 1052 (<span id="count">0</span>)</span><button class="danger" onclick="clearVault()" style="min-height:36px;padding:4px 8px;font-size:.7rem">Очистить всё</button></div><input type="text" id="searchBox" oninput="renderVault()" placeholder="Поиск по промптам, тегам или смыслу..."><div class="vault-list" id="vaultList"></div></div></div></div><script>const STORAGE_KEY='omega_capcut_387_1052';let archive=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');const setStatus=m=>document.getElementById('statusMsg').textContent=m;async function syncFromCloud(){if(location.protocol==='file:'){setStatus('Локальный режим ProBook. Архив активен.');return}try{const r=await fetch('./capcut_vectors.json?t='+Date.now());if(!r.ok)return;const d=await r.json();if(Array.isArray(d)&&d.length){const s=new Set(archive.map(x=>x.content));let a=0;d.forEach(i=>{if(i.content&&!s.has(i.content)){archive.push(i);s.add(i.content);a++}});if(a){localStorage.setItem(STORAGE_KEY,JSON.stringify(archive));renderVault();setStatus(`Загружено из облака: +${a} векторов.`);return}}setStatus('Облачный архив 387 1052 синхронизирован.')}catch(e){setStatus('Локальный кэш активен.')}}function importVectors(){const raw=document.getElementById('rawInput').value.trim();if(!raw){setStatus('Поле пустое — вставь текст переписки.');return}if(/<!DOCTYPE html>|<script>|Set-Content\s+-Path/i.test(raw)){setStatus('Блокировка: обнаружен системный HTML/PowerShell код вместо текста чата!');return}const b=raw.split(/\n\s*\n/).map(x=>x.trim()).filter(x=>x.length>3);const t=new Date().toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});b.forEach(txt=>{archive.unshift({id:Date.now()+Math.random(),chat:'387 1052',tag:/[a-zA-Z]{4,}/.test(txt)?'PROMPT_ENG':'CHRONICLE_RU',content:txt,time:t})});localStorage.setItem(STORAGE_KEY,JSON.stringify(archive));document.getElementById('rawInput').value='';setStatus(`Извлечено векторов: ${b.length}. Сохранено в архив.`);renderVault()}function copyText(i){navigator.clipboard.writeText(archive[i].content);setStatus('Скопировано в буфер обмена.')}function deleteItem(i){archive.splice(i,1);localStorage.setItem(STORAGE_KEY,JSON.stringify(archive));renderVault();setStatus('Карточка удалена.')}function exportJSON(){if(!archive.length){setStatus('Архив пуст.');return}const u=URL.createObjectURL(new Blob([JSON.stringify(archive,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download='capcut_vectors.json';a.click();URL.revokeObjectURL(u);setStatus('Файл capcut_vectors.json скачан.')}function clearVault(){if(confirm('Удалить все записи из локального кэша 387 1052?')){archive=[];localStorage.removeItem(STORAGE_KEY);renderVault();setStatus('Архив полностью очищен.')}}function renderVault(){const q=document.getElementById('searchBox').value.toLowerCase(),l=document.getElementById('vaultList');document.getElementById('count').textContent=archive.length;l.innerHTML='';archive.forEach((it,idx)=>{if(q&&!it.content.toLowerCase().includes(q)&&!it.tag.toLowerCase().includes(q))return;const d=document.createElement('div');d.className='item';d.innerHTML=`<div class="item-head"><span class="tag ${it.tag==='PROMPT_ENG'?'tag-eng':'tag-ru'}">${it.tag}</span><span style="color:#666">${it.time||''}</span></div><div class="item-body"></div><div class="item-actions"><button class="copy-mini" onclick="copyText(${idx})">Копировать</button><button class="del-mini" onclick="deleteItem(${idx})">✕</button></div>`;d.querySelector('.item-body').textContent=it.content;l.appendChild(d)})}renderVault();syncFromCloud();</script></body></html>
