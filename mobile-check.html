<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Reality-1 · Mobile Check 3.0.1</title><style>:root{color-scheme:dark;font:16px system-ui}*{box-sizing:border-box}body{margin:0;padding:24px;padding:max(24px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left));background:#080812;color:#eee}main{max-width:600px;margin:auto}button,a{font:inherit;display:inline-block;min-width:44px;min-height:44px;padding:16px;color:#62eaff}button{background:#161627;border:1px solid #00eaff;border-radius:16px;margin:8px}#target{width:88px;height:88px}span{display:block;background:#00eaff;width:44px;height:44px;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);pointer-events:none}pre{white-space:pre-wrap;overflow-wrap:anywhere}:focus-visible{outline:3px solid #00eaff;outline-offset:4px}</style></head><body><main><h1>Reality-1 · Mobile Check</h1><p>Версия 3.0.1. Отчёт измеряет только эту страницу. Коснитесь ромба и поверните телефон.</p><button id="target" aria-label="Проверить касание"><span aria-hidden="true"></span></button><button id="refresh">Обновить отчёт</button><p id="status" role="status">Ожидание касания.</p><pre id="report"></pre><p>Наличие API не подтверждает работу звука. Визуальная проверка safe-area не выполнена.</p><a href="./index.html">Вернуться в Reality-1</a><noscript>Для диагностики включите JavaScript.</noscript></main><script>
'use strict';
const target=document.getElementById('target'),report=document.getElementById('report'),statusNode=document.getElementById('status');
let taps=0,pointer='unknown';
function update(){const r=target.getBoundingClientRect(),v=window.visualViewport,s=getComputedStyle(document.body);report.textContent=JSON.stringify({revision:'3.0.1',scope:'diagnostic page only',host:location.host||'local file',secure_context:window.isSecureContext,viewport:{width:innerWidth,height:innerHeight},visual_viewport:v?{width:Math.round(v.width),height:Math.round(v.height),scale:v.scale}:null,button:{width:r.width,height:r.height,meets_44px:r.width>=44&&r.height>=44},body_padding:{top:s.paddingTop,right:s.paddingRight,bottom:s.paddingBottom,left:s.paddingLeft},horizontal_overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth,last_pointer:pointer,activations:taps,touch_points:navigator.maxTouchPoints||0,web_audio_api_available:!!(window.AudioContext||window.webkitAudioContext),audio_playback_test:'not performed',safe_area_visual_test:'not performed'},null,2)}
target.onpointerdown=e=>{pointer=e.pointerType||'unknown'};target.onclick=e=>{taps++;if(e.detail===0)pointer='keyboard_or_assistive';statusNode.textContent='Активаций: '+taps;update()};document.getElementById('refresh').onclick=update;window.addEventListener('resize',update);if(window.visualViewport)window.visualViewport.addEventListener('resize',update);update();
</script></body></html>
