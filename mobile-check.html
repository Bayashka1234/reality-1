<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Reality-1 · Mobile Check</title><style>:root{color-scheme:dark;font:16px system-ui}*{box-sizing:border-box}body{margin:0;padding:24px;background:#080812;color:#eee}main{max-width:600px;margin:auto}button{font:inherit;min-width:44px;min-height:44px;padding:16px;background:#161627;color:white;border:1px solid #00eaff;border-radius:16px;margin:8px}#target{width:88px;height:88px}span{display:block;background:#00eaff;width:44px;height:44px;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);pointer-events:none}pre{white-space:pre-wrap;overflow-wrap:anywhere}a{color:#62eaff}</style></head><body><main><h1>Reality-1 · Mobile Check</h1><p>Коснитесь ромба, поверните телефон и увеличьте страницу. Отчёт остаётся в браузере.</p><button id="target" aria-label="Проверить касание"><span aria-hidden="true"></span></button><button id="refresh">Обновить отчёт</button><p id="status" role="status">Ожидание касания.</p><pre id="report"></pre><p>Наличие Web Audio API не подтверждает воспроизведение. Это не проверка безопасности.</p><a href="./">Вернуться в Reality-1</a></main><script>'use strict';const target=document.getElementById('target'),report=document.getElementById('report'),status=document.getElementById('status');let taps=0,pointer='unknown';function update(){const r=target.getBoundingClientRect(),v=window.visualViewport;report.textContent=JSON.stringify({revision:3,viewport:{width:innerWidth,height:innerHeight},visual_viewport:v?{width:Math.round(v.width),height:Math.round(v.height),scale:v.scale}:null,button:{width:r.width,height:r.height,meets_44px:r.width>=44&&r.height>=44},horizontal_overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth,last_pointer:pointer,activations:taps,touch_points:navigator.maxTouchPoints||0,web_audio:!!(window.AudioContext||window.webkitAudioContext)},null,2)}target.onpointerdown=e=>{pointer=e.pointerType||'unknown'};target.onclick=e=>{taps++;if(e.detail===0)pointer='keyboard_or_assistive';status.textContent='Активаций: '+taps;update()};document.getElementById('refresh').onclick=update;window.addEventListener('resize',update);if(window.visualViewport)window.visualViewport.addEventListener('resize',update);update();</script></body></html>
