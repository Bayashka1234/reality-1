<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Reality-1 · Mobile Check</title><style>:root{color-scheme:dark;font-family:system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100svh;padding:20px;padding:max(20px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left));background:#080812;color:#eee}main{width:min(100%,560px);margin:auto;overflow-wrap:anywhere}h1{font-size:24px}.controls{display:flex;flex-wrap:wrap;gap:16px;margin:24px 0}button{min-width:44px;min-height:44px;padding:12px;border:1px solid #00f2ff;border-radius:12px;background:#151524;color:white;font:inherit;touch-action:manipulation}button:focus-visible{outline:3px solid white;outline-offset:4px}#target{width:88px;height:88px;display:grid;place-items:center;transition:transform .1s}#target:active{transform:scale(.92)}.diamond{width:44px;height:44px;background:#00f2ff;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);pointer-events:none}pre{padding:16px;border:1px solid #555;border-radius:12px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}p{line-height:1.6}a{color:#00f2ff}@media(prefers-reduced-motion:reduce){#target{transition:none}}</style></head><body><main><h1>Reality-1 · Mobile Check</h1><p>Коснись ромба, поверни телефон и увеличь страницу. Результаты остаются в браузере и не отправляются на сервер.</p><div class="controls"><button id="target" aria-label="Проверить касание"><span class="diamond" aria-hidden="true"></span></button><button id="refresh">Обновить отчёт</button></div><p id="status" role="status">Ожидание касания.</p><pre id="report"></pre><p>Наличие API не подтверждает воспроизведение звука. Это не проверка безопасности или сертификация Safari.</p><a href="./">Вернуться в Reality-1</a></main><script>'use strict';const target=document.getElementById('target'),status=document.getElementById('status'),report=document.getElementById('report');let taps=0,pointer='unknown';function update(){const r=target.getBoundingClientRect(),v=window.visualViewport;report.textContent=JSON.stringify({viewport:{width:innerWidth,height:innerHeight},visual_viewport:v?{width:Math.round(v.width),height:Math.round(v.height),scale:v.scale}:null,pixel_ratio:devicePixelRatio,horizontal_overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth,button:{width:Math.round(r.width),height:Math.round(r.height),meets_44px:r.width>=44&&r.height>=44},touch_points:navigator.maxTouchPoints||0,last_pointer:pointer,activations:taps,web_audio:!!(window.AudioContext||window.webkitAudioContext),viewport_meta:document.querySelector('meta[name=viewport]').content},null,2)}target.addEventListener('pointerdown',e=>{pointer=e.pointerType||'unknown'});target.addEventListener('click',e=>{taps++;if(e.detail===0)pointer='keyboard_or_assistive';status.textContent='Кнопка активирована: '+taps;setTimeout(update,150)});document.getElementById('refresh').onclick=update;window.addEventListener('resize',update);if(window.visualViewport)window.visualViewport.addEventListener('resize',update);update();</script></body></html>
