name: Deploy Reality-1 to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v6.0.0
      - name: Prepare static site
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s mobile-check.html
          mkdir -p _site
          cp index.html mobile-check.html _site/
          for dir in assets audio images docs; do
            if [ -d "$dir" ]; then cp -R "$dir" _site/; fi
          done
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site
          include-hidden-files: true
  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5.0.1
        id: deployment
