name: Deploy Reality-1 to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare static site bundle
        run: |
          mkdir -p _site
          for file in index.html portal_omega.html mobile-check.html telegram-mini-graph.html capcut_vectors.json; do
            if [ -f "$file" ]; then cp "$file" _site/; fi
          done
          for dir in assets audio images docs public pages Bay; do
            if [ -d "$dir" ]; then cp -r "$dir" _site/; fi
          done
          touch _site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
