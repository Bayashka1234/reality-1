name: Validate Reality-1 static site
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Check static site and Vercel configuration
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for name in ('index.html', 'mobile-check.html'):
              page = Path(name)
              assert page.is_file() and page.stat().st_size > 0, f'Missing or empty: {name}'
          config = json.loads(Path('vercel.json').read_text())
          assert config.get('framework') is None, 'Expected static site framework'
          assert config.get('buildCommand') == '', 'Expected no build command'
          assert config.get('outputDirectory') == '.', 'Expected repository root output'
          print('Static site configuration checks passed')
          PY
