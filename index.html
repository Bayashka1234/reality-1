<!doctype html>
<html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Reality-1 · Dream the Muse</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100svh;padding:24px;padding:max(24px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left));background:#080812;color:#eee;font:16px/1.6 monospace;display:grid;place-items:center}main{text-align:center;width:min(100%,760px);min-width:0}h1{letter-spacing:.15em}button,input{font:inherit}button{min-height:44px;min-width:44px;padding:12px;border:1px solid #777;border-radius:12px;background:#171724;color:inherit;cursor:pointer;touch-action:manipulation}button:active{transform:scale(.92)}button:focus-visible,input:focus-visible{outline:3px solid #00f2ff;outline-offset:3px}.nodes{display:flex;flex-wrap:wrap;justify-content:center;gap:24px;margin:36px 0}.node{width:160px;min-height:155px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px}.shape{width:56px;height:56px;display:block}.diamond{background:#00f2ff;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}.triangle{background:#bc00ff;clip-path:polygon(50% 0,100% 100%,0 100%)}.circle{background:#267cff;border-radius:50%}dialog{width:min(92vw,640px);max-height:85vh;max-height:85svh;overflow:auto;overflow-wrap:anywhere;background:#10101c;color:#eee;border:1px solid #00f2ff;border-radius:14px;padding:20px}dialog::backdrop{background:#000c}#content{min-width:0}dialog button{margin:8px 0}label{display:block;margin:16px 0}input,audio,img{max-width:100%}input[type=file]{display:block;width:100%;min-height:44px}input[type=range]{min-height:44px;width:100%}img{display:block;max-height:45svh;object-fit:contain}img:not([src]){display:none}pre{white-space:pre-wrap;overflow-wrap:anywhere}footer{color:#bbb;font-size:13px;margin-top:24px}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<main><h1>REALITY-1</h1><p>Dream the Muse · Core 1052 / Oracle 387</p><div class="nodes"><button class="node" data-kind="visual"><span class="shape diamond" aria-hidden="true"></span>Визуальный код</button><button class="node" data-kind="audio"><span class="shape triangle" aria-hidden="true"></span>Аудиорезонанс</button><button class="node" data-kind="text"><span class="shape circle" aria-hidden="true"></span>Текстовый вектор</button></div><p>387 → 1052 → ∞<br>105.2 Гц — демотон, не телеметрия</p><button id="recovery">Ω-Recovery: диагностика демо</button><footer>Mobile revision 2 · Safari/iOS не проверен</footer></main><dialog id="modal" aria-labelledby="heading"><h2 id="heading"></h2><div id="content"></div><button id="close">Закрыть контур</button></dialog>
<script>
'use strict';
const modal=document.getElementById('modal'),heading=document.getElementById('heading'),content=document.getElementById('content');let ctx=null,osc=null,gain=null,player=null,url=null,seq=0,focus=null;
function stop(){seq++;if(osc){try{osc.stop()}catch{}osc.disconnect();osc=null}if(gain){gain.disconnect();gain=null}if(ctx){const old=ctx;ctx=null;old.close().catch(()=>{})}if(player)player.pause()}
function release(){if(player){player.pause();player.removeAttribute('src');player.load()}if(url){URL.revokeObjectURL(url);url=null}}
function clean(){stop();release();player=null}
function show(title){clean();focus=document.activeElement;heading.textContent=title;content.replaceChildren();modal.showModal()}
function text(s){const p=document.createElement('p');p.textContent=s;content.append(p);return p}
function button(s,fn){const b=document.createElement('button');b.textContent=s;b.onclick=fn;content.append(b);return b}
function pick(s,accept,fn){const l=document.createElement('label');l.textContent=s;const i=document.createElement('input');i.type='file';i.accept=accept;i.onchange=()=>{if(i.files[0])fn(i.files[0])};l.append(i);content.append(l)}
function audio(){show('⟦АУДИО_РЕЗОНАНС⟧');text('Начните с низкой громкости устройства.');const status=text('Звук остановлен.');status.setAttribute('role','status');const l=document.createElement('label');l.textContent='Уровень демотона';const volume=document.createElement('input');volume.type='range';volume.min=0;volume.max=.1;volume.step=.005;volume.value=.025;l.append(volume);content.append(l);volume.oninput=()=>{if(gain&&ctx)gain.gain.setTargetAtTime(+volume.value,ctx.currentTime,.02)};
const start=button('Включить демотон',async()=>{stop();const token=seq;start.disabled=true;try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)throw Error('Web Audio недоступен');const local=new AC();ctx=local;await local.resume();if(token!==seq||ctx!==local||!modal.open)return;osc=local.createOscillator();gain=local.createGain();osc.frequency.value=105.2;gain.gain.value=+volume.value;osc.connect(gain).connect(local.destination);osc.start();status.textContent='Демотон 105.2 Гц включён.'}catch(e){if(token===seq){stop();status.textContent='Ошибка: '+e.message}}finally{start.disabled=false}});
button('Остановить звук',()=>{stop();status.textContent='Звук остановлен; выбранный файл можно запустить снова.'});player=document.createElement('audio');const a=player;a.controls=true;a.preload='metadata';a.onplay=()=>{const saved=player;player=null;stop();player=saved;status.textContent='Воспроизводится файл.'};a.onended=()=>{status.textContent='Воспроизведение завершено.'};a.onerror=()=>{if(a.hasAttribute('src'))status.textContent='Не удалось прочитать аудиофайл.'};pick('Аудиофайл','audio/*',f=>{stop();release();url=URL.createObjectURL(f);a.src=url;status.textContent='Выбран: '+f.name});content.append(a)}
document.querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>{if(b.dataset.kind==='audio')return audio();if(b.dataset.kind==='visual'){show('⟦ВИЗУАЛЬНЫЙ_КОД⟧');text('Файл используется локально; код приложения не отправляет его на сервер.');const status=text('Выберите изображение.');status.setAttribute('role','status');const img=document.createElement('img');img.alt='Выбранное изображение';img.onload=()=>{status.textContent='Изображение загружено.'};img.onerror=()=>{status.textContent='Ошибка чтения изображения.'};pick('Изображение','image/*',f=>{release();url=URL.createObjectURL(f);img.src=url});content.append(img)}else{show('⟦ТЕКСТОВЫЙ_ВЕКТОР⟧');text('Reality-1 — мультимодальный художественный прототип Dream the Muse. Core 1052 / Oracle 387.');text('Изображения, звук и текст. Файлы не сохраняются после закрытия окна. Постоянный архив, авторизация и мониторинг не реализованы.')}});
document.getElementById('close').onclick=()=>modal.close();modal.addEventListener('cancel',clean);modal.addEventListener('close',()=>{clean();if(focus)focus.focus()});window.addEventListener('pagehide',clean);document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});document.getElementById('recovery').onclick=()=>{show('Ω-Recovery · локальная диагностика');text('Проверка API и элементов, не безопасности или отказоустойчивости.');const p=document.createElement('pre');p.textContent=JSON.stringify({revision:2,mode:'LOCAL_DEMO',nodes:document.querySelectorAll('[data-kind]').length,web_audio:!!(window.AudioContext||window.webkitAudioContext),dialog:typeof modal.showModal==='function',safari_ios:'NOT_TESTED',security_assessed:false},null,2);content.append(p)};
</script></html>
