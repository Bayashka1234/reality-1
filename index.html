<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080812">
<title>Reality-1 · Dream the Muse</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:#080812;color:#eee;padding:24px;padding:max(24px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left));min-height:100vh;min-height:100svh}main{max-width:820px;margin:6vh auto;text-align:center}h1{font-size:clamp(32px,8vw,64px);letter-spacing:.1em}p{line-height:1.7}.nodes,.actions{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;margin:24px 0}button,a{font:inherit;color:#62eaff}button{min-height:44px;padding:16px;border:1px solid #62627e;border-radius:16px;background:#141423;color:white;cursor:pointer}.node{width:200px;min-height:140px}:focus-visible{outline:3px solid #00eaff;outline-offset:4px}dialog{background:#10101c;color:#eee;border:1px solid #00eaff;border-radius:20px;width:min(94vw,640px);max-height:85vh;max-height:85svh;overflow:auto;padding:24px}dialog::backdrop{background:#000c}input,audio,img{max-width:100%}img{max-height:45vh;object-fit:contain}label{display:block;margin:20px 0}footer{margin-top:40px;font-size:13px;color:#aaa}pre{white-space:pre-wrap;overflow-wrap:anywhere}@media(prefers-reduced-motion:no-preference){button:active{transform:scale(.97)}}
</style>
</head>
<body>
<main><p>Dream the Muse · Core 1052 / Oracle 387</p><h1>REALITY-1</h1><p>Изображение · звук · текст</p><div class="nodes"><button class="node" data-mode="visual">◇ Визуальный код</button><button class="node" data-mode="audio">△ Аудиорезонанс</button><button class="node" data-mode="text">○ Текстовый вектор</button></div><p>387 → 1052 → ∞<br>105.2 Гц — демотон, не телеметрия</p><button id="diagnose">Локальный отчёт</button><p><a href="./mobile-check.html">Мобильная диагностика</a></p><p id="notice" role="status"></p><noscript>Для интерактивных функций включите JavaScript.</noscript><footer>Mini App Preview 1 · Проверка на устройствах не выполнена.<br>Выбранные файлы не отправляются этой страницей на сервер.</footer></main>
<dialog id="modal" aria-labelledby="heading"><h2 id="heading"></h2><div id="content"></div><div class="actions"><button id="close" autofocus>Закрыть</button></div></dialog>
<script>
'use strict';
const modal=document.getElementById('modal'),content=document.getElementById('content'),heading=document.getElementById('heading');let ctx=null,audio=null,url=null,focusBefore=null,generation=0;
function stop(){generation++;if(audio)audio.pause();if(ctx){const old=ctx;ctx=null;old.close().catch(()=>{})}}
function clean(){stop();if(audio){audio.removeAttribute('src');audio.load();audio=null}if(url){URL.revokeObjectURL(url);url=null}}
function el(tag,text,parent=content){const n=document.createElement(tag);if(text)n.textContent=text;parent.append(n);return n}
function panel(title){if(typeof modal.showModal!=='function'){document.getElementById('notice').textContent='Обновите браузер: диалог недоступен.';return false}clean();focusBefore=document.activeElement;heading.textContent=title;content.replaceChildren();if(!modal.open)modal.showModal();return true}
function choose(accept,callback){const l=el('label','Выберите локальный файл'),i=el('input','',l);i.type='file';i.accept=accept;i.onchange=()=>{if(i.files[0])callback(i.files[0])}}
for(const b of document.querySelectorAll('[data-mode]'))b.onclick=()=>{if(!panel(b.textContent))return;if(b.dataset.mode==='visual'){const img=el('img');img.alt='Выбранное изображение';img.hidden=true;const status=el('p','Выберите изображение.');status.setAttribute('role','status');img.onload=()=>{img.hidden=false;status.textContent='Изображение загружено.'};img.onerror=()=>{img.hidden=true;status.textContent='Формат изображения не поддерживается.'};choose('image/*',f=>{img.hidden=true;img.removeAttribute('src');if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(f);img.src=url})}else if(b.dataset.mode==='audio'){el('p','Начните с низкой громкости. При дискомфорте остановите звук.');const status=el('p','Звук остановлен.');status.setAttribute('role','status');const l=el('label','Уровень демотона'),v=el('input','',l);v.type='range';v.min=0;v.max=.1;v.step=.005;v.value=.025;let gain=null;v.oninput=()=>{if(ctx&&gain)gain.gain.setTargetAtTime(Number(v.value),ctx.currentTime,.02)};const start=el('button','Включить демотон');start.onclick=async()=>{stop();const token=generation;start.disabled=true;try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)throw Error('Web Audio недоступен');const local=new AC();ctx=local;await local.resume();if(token!==generation||ctx!==local||!modal.open)return;if(local.state!=='running')throw Error('Запуск звука запрещён браузером');const osc=local.createOscillator();gain=local.createGain();osc.frequency.value=105.2;gain.gain.setValueAtTime(0,local.currentTime);gain.gain.linearRampToValueAtTime(Number(v.value),local.currentTime+.05);osc.connect(gain).connect(local.destination);osc.start();status.textContent='Демотон включён.'}catch(e){if(token===generation){stop();status.textContent=e.message}}finally{start.disabled=false}};el('button','Остановить звук').onclick=()=>{stop();status.textContent='Звук остановлен.'};const player=el('audio');audio=player;player.controls=true;player.preload='metadata';player.onplay=()=>{if(ctx){const old=ctx;ctx=null;generation++;old.close().catch(()=>{})}status.textContent='Воспроизводится локальный файл.'};player.onerror=()=>{if(player.hasAttribute('src'))status.textContent='Не удалось прочитать аудио.'};choose('audio/*',f=>{stop();player.removeAttribute('src');player.load();if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(f);player.src=url;status.textContent='Выбран: '+f.name})}else{el('p','Reality-1 — художественный мультимодальный прототип Dream the Muse.');el('p','ИИ-чат, постоянный архив, платежи, авторизация и серверное восстановление не реализованы.')}};
document.getElementById('close').onclick=()=>modal.close();modal.addEventListener('close',()=>{clean();if(focusBefore?.isConnected)focusBefore.focus()});modal.addEventListener('cancel',clean);window.addEventListener('pagehide',clean);document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});
const tg=window.Telegram?.WebApp;const inTelegram=!!tg&&tg.platform!=='unknown';if(inTelegram){tg.ready();tg.expand();if(tg.isVersionAtLeast('6.1')){tg.setBackgroundColor('#080812');tg.BackButton.onClick(()=>{if(modal.open)modal.close()});const sync=()=>modal.open?tg.BackButton.show():tg.BackButton.hide();new MutationObserver(sync).observe(modal,{attributes:true,attributeFilter:['open']});sync()}}
document.getElementById('diagnose').onclick=()=>{if(panel('Локальный отчёт')){el('p','Наличие API не подтверждает успешное воспроизведение или авторизацию.');el('pre',JSON.stringify({revision:'miniapp-preview-1',host:location.host,secure_context:window.isSecureContext,telegram_environment:inTelegram,web_audio_available:!!(window.AudioContext||window.webkitAudioContext),device_test:'not performed'},null,2))}};
</script>
</body></html>
