<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reality-1</title>
<style>
:root{color-scheme:dark;--cyan:#00f2ff;--purple:#bc00ff;--blue:#0066ff}*{box-sizing:border-box}body{margin:0;min-height:100svh;background:#050505;color:#eee;font:16px monospace;display:grid;place-items:center;padding:24px}main{text-align:center;width:min(100%,720px)}h1{letter-spacing:5px}.nodes{display:flex;flex-wrap:wrap;justify-content:center;gap:28px;margin:60px 0}button{font:inherit;color:inherit;cursor:pointer;min-width:44px;min-height:44px}button:focus-visible{outline:3px solid white;outline-offset:6px}.node{border:1px solid #333;border-radius:14px;background:#101015;width:130px;min-height:140px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:transform .1s}.node:active{transform:scale(.92)}.shape{display:block;width:56px;height:56px;pointer-events:none}.diamond{background:var(--cyan);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}.triangle{background:var(--purple);clip-path:polygon(50% 0,100% 100%,0 100%)}.circle{background:var(--blue);border-radius:50%}.muted{color:#aaa;line-height:1.6}dialog{background:#080c13;color:#eee;border:1px solid var(--cyan);border-radius:14px;width:min(92vw,640px);max-height:85svh;padding:24px;overflow:auto}dialog::backdrop{background:#000c;backdrop-filter:blur(8px)}dialog img{max-width:100%;height:auto}dialog button,.recovery{padding:10px 18px;background:#151526;border:1px solid #888;border-radius:6px;margin:8px}input{max-width:100%;margin:12px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;text-align:left}#notice{min-height:3em} @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><main><h1>REALITY-1</h1><p class="muted">Dream the Muse · Core 1052 / Oracle 387</p><div class="nodes"><button class="node" data-kind="visual"><span class="shape diamond"></span>Визуальный код</button><button class="node" data-kind="audio"><span class="shape triangle"></span>Аудиорезонанс</button><button class="node" data-kind="text"><span class="shape circle"></span>Текстовый вектор</button></div><p class="muted">387 → 1052 → ∞<br>105.2 Гц — параметр демотона, не телеметрия</p><button class="recovery" id="recovery">Ω-Recovery: симуляция</button><p id="notice" role="status" class="muted">Локальный прототип · защита и синхронизация не проверялись</p></main>
<dialog id="modal" aria-labelledby="heading"><h2 id="heading"></h2><div id="content"></div><button id="close">Закрыть контур</button></dialog>
<script>
'use strict';
const modal=document.querySelector('#modal'),heading=document.querySelector('#heading'),content=document.querySelector('#content'),notice=document.querySelector('#notice');
let ctx=null,osc=null,gain=null,imageURL=null;
function stop(){if(osc){try{osc.stop()}catch{}osc.disconnect();osc=null}if(gain){gain.disconnect();gain=null}if(ctx){ctx.close().catch(()=>{});ctx=null}if(imageURL){URL.revokeObjectURL(imageURL);imageURL=null}const a=content.querySelector('audio');if(a){a.pause();a.removeAttribute('src');a.load()}}
function open(title){stop();heading.textContent=title;content.replaceChildren();modal.showModal()}
function paragraph(text){const p=document.createElement('p');p.textContent=text;content.append(p);return p}
function button(text,fn){const b=document.createElement('button');b.textContent=text;b.addEventListener('click',fn);content.append(b);return b}
function picker(accept,fn){const input=document.createElement('input');input.type='file';input.accept=accept;input.addEventListener('change',()=>{if(input.files[0])fn(input.files[0])});content.append(input)}
document.querySelectorAll('[data-kind]').forEach(b=>b.addEventListener('click',()=>{
const kind=b.dataset.kind;
if(kind==='visual'){open('⟦ВИЗУАЛЬНЫЙ_КОД⟧');paragraph('Выберите локальное изображение. Приложение не отправляет его на сервер.');const img=document.createElement('img');img.alt='Выбранное пользователем изображение';picker('image/*',file=>{if(imageURL)URL.revokeObjectURL(imageURL);imageURL=URL.createObjectURL(file);img.src=imageURL});content.append(img)}
if(kind==='audio'){open('⟦АУДИО_РЕЗОНАНС⟧');paragraph('Демотон 105.2 Гц. Начните с низкой громкости. Либо выберите свой аудиофайл.');const status=paragraph('Звук остановлен.');button('Включить демотон',async()=>{stop();try{const AudioContext=window.AudioContext||window.webkitAudioContext;if(!AudioContext)throw Error('Web Audio недоступен');ctx=new AudioContext();await ctx.resume();osc=ctx.createOscillator();gain=ctx.createGain();osc.frequency.value=105.2;gain.gain.value=.025;osc.connect(gain).connect(ctx.destination);osc.start();status.textContent='Демотон включён: 105.2 Гц'}catch(e){stop();status.textContent='Не удалось включить звук: '+e.message}});button('Остановить звук',()=>{stop();status.textContent='Звук остановлен.'});const audio=document.createElement('audio');audio.controls=true;audio.style.maxWidth='100%';picker('audio/*',file=>{stop();imageURL=URL.createObjectURL(file);audio.src=imageURL;status.textContent='Локальный файл готов к воспроизведению.'});audio.addEventListener('play',()=>{if(osc){try{osc.stop()}catch{}osc.disconnect();osc=null}});content.append(audio)}
if(kind==='text'){open('⟦ТЕКСТОВЫЙ_ВЕКТОР⟧');paragraph('Reality-1 — мультимодальный художественный прототип Dream the Muse. Core: 1052. Oracle: 387.');paragraph('Изображения и аудио выбираются локально. Постоянный архив, проверка защиты и сетевой мониторинг не реализованы.')}
}));
document.querySelector('#close').addEventListener('click',()=>modal.close());modal.addEventListener('close',stop);modal.addEventListener('cancel',stop);
document.querySelector('#recovery').addEventListener('click',()=>{open('Ω-Recovery · симуляция');paragraph('Это локальная проверка наличия элементов интерфейса, не тест отказоустойчивости. Данные не удаляются, сетевые службы не изменяются.');const p=document.createElement('pre');p.textContent=JSON.stringify({mode:'SIMULATION',node_buttons:document.querySelectorAll('[data-kind]').length,dialog_present:!!modal,web_audio_available:!!(window.AudioContext||window.webkitAudioContext),archive_verified:false,security_assessed:false},null,2);content.append(p)});
</script></body></html>
